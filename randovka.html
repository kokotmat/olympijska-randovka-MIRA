function expandTeacherNames(value){
 return value.replace(/[\p{L}\p{M}]+(?:-[\p{L}\p{M}]+)*/gu,(word,offset,source)=>{
  const full=TEACHER_NAMES[word.toLocaleLowerCase('cs')];if(!full)return word;
  const split=full.lastIndexOf(' '),first=full.slice(0,split+1),surname=full.slice(split+1);
  return source.slice(0,offset).toLocaleLowerCase('cs').endsWith(first.toLocaleLowerCase('cs'))?surname:full;
 });
}
function correctAnswerLabel(value){
 if(value.toLocaleLowerCase('cs')==='zsv')return 'Základy společenských věd';
 return expandTeacherNames(value.replace(/\bPetrnouss?ek\b/giu,'Petrnoušek'));
}

function validateQuestions(data){
 if(!Array.isArray(data)||data.length<1||data.length>1000)throw Error('Vložte pole s 1 až 1000 otázkami.');
 return data.map((q,i)=>{
  if(!q||typeof q.question!=='string'||!q.question.trim()||q.question.length>240)throw Error(`Otázka ${i+1}: text musí mít 1 až 240 znaků.`);
  if(!Array.isArray(q.answers)||q.answers.length!==6)throw Error(`Otázka ${i+1}: musí mít přesně 6 odpovědí.`);
  if(q.note!==undefined&&(typeof q.note!=='string'||q.note.length>1500))throw Error(`Otázka ${i+1}: poznámka smí mít nejvýše 1500 znaků.`);
  if(q.scoring!==undefined){
   if(q.scoring!=='per100'||!Number.isInteger(q.respondents)||q.respondents<1||q.respondents>100000||!Number.isInteger(q.otherPoints)||q.otherPoints<0||q.otherPoints>100)throw Error(`Otázka ${i+1}: neplatné údaje bodování pro 100 lidí.`);
   if(q.answers.some(a=>!a||!Number.isInteger(a.rawVotes)||a.rawVotes<0||a.rawVotes>q.respondents)||q.answers.reduce((n,a)=>n+a.rawVotes,0)>q.respondents)throw Error(`Otázka ${i+1}: neplatné původní počty hlasů.`);
   if(q.answers.reduce((n,a)=>n+a.points,0)+q.otherPoints!==100)throw Error(`Otázka ${i+1}: body tabule a ostatních odpovědí musí dát dohromady 100.`);
  }
  return {question:q.question.trim(),...(q.note?{note:correctModeratorNote(q.note)}:{}),...(q.scoring?{scoring:q.scoring,respondents:q.respondents,otherPoints:q.otherPoints}:{}),answers:q.answers.map((a,j)=>{
   if(!a||typeof a.text!=='string'||!a.text.trim()||a.text.length>100)throw Error(`Otázka ${i+1}, odpověď ${j+1}: text musí mít 1 až 100 znaků.`);
   if(!Number.isInteger(a.points)||a.points<0||a.points>100000)throw Error(`Otázka ${i+1}, odpověď ${j+1}: body musí být celé číslo 0 až 100000.`);
   if(a.rawVotes!==undefined&&(!Number.isInteger(a.rawVotes)||a.rawVotes<0||a.rawVotes>100000))throw Error(`Otázka ${i+1}, odpověď ${j+1}: neplatný původní počet hlasů.`);
   return {text:correctAnswerLabel(a.text.trim()),points:a.points,...(a.rawVotes!==undefined?{rawVotes:a.rawVotes}:{})};
  })};
 });
}

 update(s=>{s.screen=screen;s.effect=null;if(screen==='game'){const r=ensureRoundTeams(s);s.active=r.settled?r.winner||r.owner:r.steal?r.challenger:r.owner;}});

function rankings(s=state){
 const sorted=s.teams.map((t,i)=>({...t,order:i})).sort((a,b)=>b.score-a.score||a.order-b.order);
 let rank=1;return sorted.map((t,i)=>{if(i>0&&t.score!==sorted[i-1].score)rank=i+1;return {...t,rank};});
}

 $('showTeams').replaceChildren(...state.teams.map((t,i)=>node('div',{class:'show-team'+(t.id===(state.active||state.teams[0].id)?' active':'')},[text('span',t.name),text('strong',t.score)])));
 if(state.effect?.id!==lastEffect){lastEffect=state.effect?.id;if(state.effect&&Date.now()-state.effect.at<3000)playStrike();}refreshConnection();
}
function playStrike(){
 const x=$('bigStrike');x.style.animation='none';x.hidden=false;void x.offsetWidth;x.style.animation='';clearTimeout(effectTimer);effectTimer=setTimeout(()=>x.hidden=true,1250);
 if(sound&&audio?.state==='running'){const osc=audio.createOscillator(),gain=audio.createGain(),now=audio.currentTime;osc.type='sawtooth';osc.frequency.setValueAtTime(145,now);osc.frequency.exponentialRampToValueAtTime(85,now+.55);gain.gain.setValueAtTime(.001,now);gain.gain.exponentialRampToValueAtTime(.12,now+.02);gain.gain.exponentialRampToValueAtTime(.001,now+.65);osc.connect(gain);gain.connect(audio.destination);osc.start(now);osc.stop(now+.7);osc.onended=()=>{osc.disconnect();gain.disconnect();};}
}
function renderEditor(app){
 const w=node('div',{class:'wrap'});w.append(header('Nastavení a import dat'));
 const json=node('textarea',{id:'json',spellcheck:'false','aria-label':'Otázky ve formátu JSON',oninput:()=>editorDirty=true});json.value=JSON.stringify(state.questions,null,2);
 const message=text('p','','help');message.setAttribute('role','status');
 const validate=()=>{try{const data=validateQuestions(JSON.parse(json.value));message.textContent=`V pořádku: ${data.length} otázek, každá má 6 odpovědí.`;message.className='good';return data;}catch(e){message.textContent=e.message;message.className='bad';return null;}};
 const save=()=>{const data=validate();if(!data)return;if(!confirm('Uložit otázky a zahájit novou hru? Všechna kola, Bank a skóre týmů se vynulují. Názvy týmů zůstanou.'))return;if(update(s=>{s.questions=data;s.rounds=data.map(blankRound);s.index=0;s.teams.forEach(t=>t.score=0);s.active=s.teams[0].id;s.effect=null;s.screen='rules';})){editorDirty=false;toast('Otázky uloženy, hra připravena.');}};
 const file=node('input',{type:'file',accept:'.json,application/json','aria-label':'Načíst JSON ze souboru',onchange:async e=>{const f=e.target.files[0];if(!f)return;if(f.size>2000000){toast('Soubor je příliš velký. Limit jsou 2 MB.');return;}try{json.value=await f.text();editorDirty=true;validate();}catch{toast('Soubor nelze přečíst.');}}});
 w.append(panel(text('h1','Vaše otázky. Vaše show.','question'),text('p','Vložte JSON ve formátu níže. Každá otázka má přesně 6 odpovědí. Body jsou nezáporná celá čísla a nemusí dávat součet 100. Pořadí odpovědí se zachová.','muted'),file,json,message,row(button('Načíst vybranou anketu do editoru',()=>{if(editorDirty&&!confirm('Nahradit rozepsaný JSON připravenou anketou?'))return;json.value=JSON.stringify(DEFAULTS,null,2);editorDirty=true;validate();}),link('Nastavit týmy','teams','button quiet'),button('Zkontrolovat JSON',validate),button('Uložit do localStorage',save,'gold'),button('Stáhnout uložené otázky',()=>saveDownload('randovka-otazky.json',JSON.stringify(state.questions,null,2)),'quiet')),text('p','Import mění celou sadu otázek. Před uložením si můžete stáhnout zálohu celé hry. Importovaný text se vždy zobrazuje bezpečně jako text.','help space')));
 const restore=node('input',{type:'file',accept:'.json,application/json','aria-label':'Obnovit zálohu celé hry',onchange:async e=>{const control=e.currentTarget,f=control.files[0];if(!f)return;try{if(f.size>3000000)throw Error('Limit zálohy jsou 3 MB.');const saved=validateState(JSON.parse(await f.text()));if(!confirm('Nahradit celou hru touto zálohou, včetně týmů a skóre?'))return;if(update(s=>{const rev=s.revision;Object.assign(s,saved);s.revision=rev;s.effect=null;})){editorDirty=false;json.value=JSON.stringify(state.questions,null,2);}}catch(err){toast('Zálohu nelze obnovit: '+err.message);}control.value='';}});
 w.append(panel(text('h2','Záloha hry'),row(button('Stáhnout zálohu celé hry',()=>saveDownload('randovka-zaloha.json',JSON.stringify(state,null,2)))),text('label','Obnovit celou hru ze zálohy'),restore,text('p','Výchozí sada obsahuje 11 otázek z dodané ankety. Body jsou uvedené pro vzorek 100 odpovědí. Původní hlasy jsou uložené jako rawVotes, skutečný počet respondentů jako respondents a body mimo šestici jako otherPoints. Součet tabule a ostatních odpovědí dává 100. Poznámka „note“ je viditelná pouze moderátorovi. Záporné skóre je povoleno pro ruční opravy a penalizace.','help space')));app.append(w);
}
function refreshConnection(){
 let projectors=0,moderators=0;for(const [id,p]of peers){if(Date.now()-p.at>7000){peers.delete(id);continue;}if(p.mode==='projector')projectors++;if(p.mode==='moderator')moderators++;}
 const connected=mode==='projector'?moderators>0:projectors>0;
 const message=mode==='projector'?(connected?'● Moderátor připojen':'○ Čekám na moderátora'):(connected?`● Projektor připojen (${projectors})`:'○ Projektor není připojen');
 document.querySelectorAll('.connection').forEach(n=>{n.textContent=storageOK?message:'Úložiště není dostupné';n.className='status connection '+(connected?'good':'muted');});
}
function heartbeat(){try{localStorage.setItem(PRESENCE+instance,JSON.stringify({mode,at:Date.now()}));}catch{storageOK=false;}refreshConnection();}
function route(){
 const next=location.hash.slice(1);if(((mode==='editor'&&editorDirty&&next!=='editor')||(mode==='teams'&&teamDirty&&next!=='teams'))&&!confirm('Opustit stránku bez uložení rozepsaných změn?')){history.replaceState(null,'','#'+mode);return;}
 mode=['projector','moderator','editor','teams','rules'].includes(next)?next:'menu';editorDirty=false;teamDirty=false;$('app').replaceChildren();$('bigStrike').hidden=true;lastEffect=state.effect?.id;render();heartbeat();
}
window.addEventListener('storage',e=>{
 if(e.key===KEY){try{if(!e.newValue){toast('Úložiště hry bylo vymazáno. Obnovte stránku.');return;}state=validateState(JSON.parse(e.newValue));render();}catch(err){toast('Nelze načíst změnu: '+err.message);}}
 else if(e.key?.startsWith(PRESENCE)){const id=e.key.slice(PRESENCE.length);if(!e.newValue)peers.delete(id);else try{const p=JSON.parse(e.newValue);if(p&&typeof p.mode==='string'&&Number.isFinite(p.at))peers.set(id,p);}catch{}refreshConnection();}
});
window.addEventListener('hashchange',route);
window.addEventListener('beforeunload',e=>{if(editorDirty||teamDirty){e.preventDefault();e.returnValue='';}});
window.addEventListener('pagehide',()=>{try{localStorage.removeItem(PRESENCE+instance);}catch{}});
window.addEventListener('pageshow',()=>{if(state)heartbeat();});
try{
 const probe=KEY+'.probe.'+instance;localStorage.setItem(probe,'1');localStorage.removeItem(probe);
 state=read();if(localStorage.getItem(KEY)!==JSON.stringify(state))localStorage.setItem(KEY,JSON.stringify(state));
 for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k?.startsWith(PRESENCE))try{const p=JSON.parse(localStorage.getItem(k));if(p&&Date.now()-p.at<7000)peers.set(k.slice(PRESENCE.length),p);}catch{}}
 route();setInterval(heartbeat,2000);
}catch(err){
 storageOK=false;$('app').append(node('div',{class:'wrap'},[panel(text('h1','Hru nelze načíst'),text('p',err.message),text('p','Povolte lokální úložiště prohlížeče. Pokud jsou uložená data poškozená, nejprve si stáhněte jejich kopii a potom je vymažte.'),row(button('Stáhnout původní uložená data',()=>{try{saveDownload('randovka-puvodni-data.json',localStorage.getItem(KEY)??localStorage.getItem(LEGACY_KEY)??localStorage.getItem(OLDEST_KEY)??'null');}catch(e){toast(e.message);}}),button('Vymazat poškozenou hru',()=>{if(confirm('Smazat uloženou hru a načíst připravenou anketu?'))try{localStorage.setItem(KEY,JSON.stringify(initial()));location.reload();}catch(e){toast(e.message);}},'danger')))]));
}
</script>
