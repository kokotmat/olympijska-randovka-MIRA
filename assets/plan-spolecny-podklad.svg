<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2100" viewBox="0 0 1600 2100" role="img" aria-labelledby="title desc"><title id="title">Eurocentrum · přízemí a ochoz</title><desc id="desc">Schematický plánek dvou podlaží s jevištěm nahoře. Modré P označuje 70 stolů v přízemí, zelené O dvacet stolů na ochozu. Každý stůl má čtyři místa. Čísla a sousedství stolů vycházejí z dodaných originálů; poměry jsou upraveny pro čitelnost.</desc><rect width="1600" height="2100" rx="36" fill="#f9fbfd"/><g font-family="Arial,sans-serif"><text x="50" y="45" fill="#607a8e" font-size="22" letter-spacing="3">EUROCENTRUM · JABLONEC NAD NISOU</text><rect x="420" y="85" width="760" height="150" rx="32" fill="#173e59"/><text x="800" y="171" text-anchor="middle" fill="white" font-size="44" font-weight="700" letter-spacing="8">JEVIŠTĚ</text><path d="M40 370H205V1730H1395V370H1560V2050H40Z" fill="#e6f4ed" stroke="#b3d6c2" stroke-width="3"/><text x="1430" y="325" fill="#006e40" font-size="28" font-weight="700" text-anchor="middle">O · OCHOZ</text><rect x="240" y="350" width="1130" height="1380" rx="32" fill="white" stroke="#c8dce9" stroke-width="3"/><text x="800" y="315" text-anchor="middle" fill="#096bab" font-size="28" font-weight="700">P · PŘÍZEMÍ</text><rect x="510" y="410" width="580" height="360" rx="40" fill="#f1f6fa" stroke="#d9e6ef" stroke-width="2" stroke-dasharray="8 12"/><text x="800" y="580" fill="#6c8596" text-anchor="middle" font-size="28">Prostor sálu</text><text x="1477" y="970" fill="#5d8b73" font-size="21" text-anchor="middle" transform="rotate(90 1477 970)">Nečíslovaná část ochozu</text><text x="800" y="2080" text-anchor="middle" fill="#607a8e" font-size="17">Schéma dvou podlaží · číslování zachováno · poměry upraveny pro přehlednost</text></g></svg>