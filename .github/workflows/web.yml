name: Web checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/site-contract.mjs
      - run: node tests/scanner-gateway.mjs
      - run: node tests/production-system.mjs
      - run: node tests/visit.mjs
      - run: node tests/table-availability.mjs
      - run: node tests/table-client.mjs
      - run: node tests/scanner-client.mjs
      - run: node tests/admin-security.mjs
      - run: node tests/admin-bridge.mjs
      - run: node tests/admin-api.mjs
      - run: node tests/outreach-admin.mjs
      - run: node tests/delivery.mjs
      - run: node tests/outreach-delivery.mjs
